<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block email_title %}Nexmart{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#f3f4f6; font-family: Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6; padding:32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                   style="max-width:480px; width:100%; background-color:#ffffff; border-radius:8px; overflow:hidden;">
                <tr>
                    <td style="padding:24px 32px; border-bottom:1px solid #e5e7eb;" align="center">
                        <img src="{{ logo_url }}" alt="Nexmart" height="32" style="display:block; height:32px;">
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px; color:#111827; font-size:14px; line-height:1.6;">
                        {% block email_body %}{% endblock %}
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 32px; background-color:#f9fafb; color:#6b7280; font-size:12px;" align="center">
                        &copy; {% now "Y" %} Nexmart. All rights reserved.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
