{# Inline in <head> so the theme is applied before first paint (no light flash on reload). #}
{# A saved choice wins; otherwise follow the OS setting. Keep in sync with static/js/theme-toggle.js. #}
<script>
    (function () {
        var stored = null;
        try {
            stored = localStorage.getItem("color-theme");
        } catch (e) {
        }
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
    })();
</script>
