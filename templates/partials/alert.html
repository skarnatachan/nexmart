{# Dismissible Flowbite alert for one django.contrib.messages message. Pass id= for a unique element id. #}
{# data-auto-dismiss: milliseconds before static/js/messages.js closes it (paused on hover/focus). #}
<div id="alert-{{ id }}" role="alert" data-auto-dismiss="5000"
     class="flex items-center gap-3 rounded-base border p-4 text-sm
       {% if message.level_tag == 'error' %}border-danger-subtle bg-danger-soft text-fg-danger-strong
       {% elif message.level_tag == 'success' %}border-success-subtle bg-success-soft text-fg-success-strong
       {% elif message.level_tag == 'warning' %}border-warning-subtle bg-warning-soft text-fg-warning
       {% else %}border-brand-subtle bg-brand-softer text-fg-brand-strong{% endif %}">
    <svg class="size-4 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10 11h2v5m-2 0h4m-2.592-8.5h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
    </svg>
    <div class="grow">{{ message }}</div>
    <button type="button" data-dismiss-target="#alert-{{ id }}" aria-label="Close"
            class="-m-1.5 inline-flex size-8 items-center justify-center rounded-base hover:bg-neutral-primary-soft/40 focus:ring-2 focus:ring-current/20">
        <span class="sr-only">Dismiss</span>
        <svg class="size-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M6 18 17.94 6M18 18 6.06 6"/>
        </svg>
    </button>
</div>
