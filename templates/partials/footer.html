{% load static %}
<footer class="mt-auto border-t border-default bg-neutral-primary-soft">
    <div class="mx-auto max-w-7xl px-4 py-8">
        <div class="flex flex-wrap justify-between gap-8">
            <div>
                <a href="{% url 'home' %}" class="flex items-center">
                    <img src="{% static 'img/logo/nexmart-logo.svg' %}" class="h-8 dark:hidden" alt="Nexmart">
                    <img src="{% static 'img/logo/nexmart-logo-white.svg' %}" class="hidden h-8 dark:block" alt="Nexmart">
                </a>
                <p class="mt-3 max-w-xs text-sm text-body">Modern eCommerce with reasonable prices.</p>
            </div>
            <div>
                <h2 class="mb-4 text-sm font-semibold uppercase text-heading">Shop by category</h2>
                <ul class="space-y-2 text-sm text-body">
                    <li><a href="{% url 'store' %}" class="link">All products</a></li>
                    {% for category in nav_categories %}
                        <li><a href="{% url 'products_by_category' category.slug %}" class="link">{{ category.category_name }}</a></li>
                    {% endfor %}
                </ul>
            </div>
        </div>
        <hr class="my-6 border-default">
        <p class="text-center text-sm text-body">&copy; {% now "Y" %} Nexmart. All rights reserved.</p>
    </div>
</footer>
